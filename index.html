<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      Viewport for a pinned, full-screen iPad web app.

      The board is a fixed 900x675 landscape canvas that <Fit> scales to the
      viewport — 1.2x on this iPad's 1080x810 panel, which is how the board
      renders larger than its own units (src/lib/canvas.js). The page itself
      must therefore never zoom, never scroll and never rubber-band. maximum-scale + user-scalable=no kill pinch and double-tap
      zoom; viewport-fit=cover lets the canvas run under the status bar in
      standalone mode.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- Home-screen install: run chromeless, no Safari UI. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Family Board" />
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />

    <!-- Matches .fb-fit's bezel grey so there is no flash before React mounts. -->
    <meta name="theme-color" content="#D9DBE0" />

    <!--
      The prototype's stylesheet @imports Archivo from Google Fonts at runtime.
      Preconnecting shaves the round trip. Self-hosting the font is Deferred
      Defect #10, owned by R14 — a cold board with no network loses its
      typeface until then.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Family Board</title>

    <style>
      /*
        Minimal page reset only. All board styling lives in the prototype's own
        stylesheet (R5 will own it as src/styles/). Nothing here may restyle
        .fb-* — this exists purely so the page contributes no margin, scrollbar
        or bounce around the board.

        `height: 100%` here and on #root is the pre-mount page only. Once the
        board mounts, Fit.jsx overwrites all three with the height it derives
        from screen.availHeight — see applyPageHeight in
        src/components/shell/Fit.jsx.

        It has to, and the claim that used to stand here — that these heights
        "no longer size anything" because .fb-fit is position: fixed — is the
        belief that hid the grey band along the bottom of the board for nine
        passes. `100%` resolves against the layout viewport, and on the wall
        iPad that viewport is 790 CSS px while the glass is 810. `overflow:
        hidden` on the *root* element is special: it propagates to the
        viewport, and the viewport's clip applies to fixed boxes, unlike an
        ordinary ancestor's. So html at 790 clipped a .fb-fit that no longer
        had anything wrong with its scale, 20px above the bottom of the screen.
        body's and #root's overflow could not have done that on their own —
        .fb-fit is fixed and escapes them — but all three get the derived
        height so the page has one answer about how tall it is rather than two.

        The `overflow: hidden` stays on purpose. A board bolted to a wall must
        not scroll or rubber-band; the clip was never the bug, its height was.

        The background below is the frame grey and is now only the pre-mount
        flash. From the first painted frame onward the sheet's
        `html { background: var(--paper) }` (src/styles/shell/Fit.js) owns the
        canvas, and .fb-fit covers the viewport.
      */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #d9dbe0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }

      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
